name: Docs

# Builds the Fumadocs user guide whenever it changes, and deploys it to the
# Cloudflare Worker at https://docs.macamp.si when a release tag (v*) is pushed.
#
# The deploy job reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from the
# `docs-production` environment, which only v* tags may use, so branches,
# pull requests and forks never see the token.
#
# The build bakes the Web Analytics beacon into every page from DOCS_ANALYTICS_TOKEN,
# a repository variable (Settings > Secrets and variables > Actions > Variables), so
# the token stays out of the repo. Without it the docs build fine but count nothing.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: Build docs (Fumadocs static export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        env:
          DOCS_ANALYTICS_TOKEN: ${{ vars.DOCS_ANALYTICS_TOKEN }}
        run: |
          [ -n "$DOCS_ANALYTICS_TOKEN" ] || echo "::warning::DOCS_ANALYTICS_TOKEN is not set: this build has no Web Analytics beacon."
          npm run build

      - name: Upload the export
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: docs-out
          path: docs-site/out
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to docs.macamp.si
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.macamp.si/
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install wrangler (pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Download the export
        uses: actions/download-artifact@v8
        with:
          name: docs-out
          path: docs-site/out

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
