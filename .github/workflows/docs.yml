name: Docs

# Builds the Fumadocs user guide and deploys it to the Cloudflare Worker at
# https://docs.macamp.si when a release tag (v*) is pushed. Pushes to branches and
# pull requests start no run: the tag run builds first and a failed build never
# deploys. "Run workflow" (workflow_dispatch) still builds any branch on demand.
#
# The deploy job reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from the
# `docs-production` environment, which only v* tags may use, so branches,
# pull requests and forks never see the token.
#
# The deploy job builds the pages it ships itself, because only it can read
# `docs-production`, which also holds DOCS_ANALYTICS_TOKEN (the Web Analytics token
# baked into every page; kept out of the repo). Without it the docs still deploy but
# count nothing.

# Every v* tag deploys, app releases included: GitHub never applied a `paths`
# filter to tag pushes, so none is listed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: Build docs (Fumadocs static export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build

  deploy:
    name: Deploy to docs.macamp.si
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.macamp.si/
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies (wrangler is pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Build static site with the Web Analytics token
        env:
          DOCS_ANALYTICS_TOKEN: ${{ secrets.DOCS_ANALYTICS_TOKEN }}
        run: |
          [ -n "$DOCS_ANALYTICS_TOKEN" ] || echo "::warning::DOCS_ANALYTICS_TOKEN is not set in docs-production: this deploy has no Web Analytics beacon."
          npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
